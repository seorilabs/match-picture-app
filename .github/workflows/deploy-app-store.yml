# App Store(iOS) 배포는 GitHub Actions macOS 러너로 실행하지 않는다. org 계약은 Apple
# archive·upload의 표준 실행 환경을 Xcode Cloud로 고정한다(액션 미닛 쿼타, 서명 경계).
#
# 이 저장소는 아직 Xcode Cloud provider binding이 없다. 그래서 macOS 러너로 우회하지 않고
# 명시적 human gate만 남긴다. 파일 자체는 삭제하지 않는다: Backoffice의 마켓 타깃 감지가
# `.github/workflows/deploy-app-store.yml` 존재로 "appstore"를 판정하므로 파일이 없으면
# App Store 배포 옵션이 사라진다.
#
# workflow_call을 제거해 deploy-all 등에서 호출할 수 없고, 수동 dispatch는 빌드 없이
# 즉시 안내 후 실패한다(ARC 러너, 쿼타 소모 없음).
name: Deploy App Store (disabled — needs Xcode Cloud binding)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: App Store release needs an approved Xcode Cloud binding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          echo "::error::App Store(iOS) 배포는 Xcode Cloud로만 실행합니다. 이 저장소에는 아직 Xcode Cloud provider binding이 없습니다."
          echo "GitHub Actions macOS 러너로 우회하지 않습니다. Xcode Cloud workflow 연결과 배포 승인을 먼저 받으세요."
          exit 1
