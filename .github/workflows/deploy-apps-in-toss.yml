# Godot Web export → AIT(.ait) 빌드 → AppsInToss 배포. org 재사용 워크플로우 호출.
# dispatch 직접 실행 또는 deploy-all.yml에서 workflow_call.
#
# 래퍼(ait/apps-in-toss-web)의 granite.config.ts는 displayName과 icon을 리터럴로 들고
# 있다. 중앙 워크플로우는 `npm run build`만 실행하고 그 값을 주입하지 않으므로,
# 환경변수에 기대면 릴리즈 빌드가 반드시 실패한다.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 저장소의 최신 stable 태그."
        type: string
        required: false
        default: ""
      memo:
        description: "배포 메모(선택)"
        type: string
        required: false
        default: ""
      upload:
        description: "false면 .ait 빌드만 하고 AppsInToss에 올리지 않는다(배포 경로 점검용)."
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        required: false
        default: true
    # caller 는 secret 을 상속하지 않는다. 아래 이름만 1:1 로 명시 전달한다.
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID:
        required: false

permissions:
  contents: read
  # org 재사용 워크플로우가 자체 선언한 권한이라 caller도 같이 부여해야 한다.
  # 좁히면 workflow 시작 단계에서 startup_failure 가 된다.
  packages: read

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@main
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      # 이 게임은 전면형 하나만 쓴다. 보상형 광고 입력은 넘기지 않는다.
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID: ${{ secrets.VITE_TOSS_INTERSTITIAL_AD_GROUP_ID }}
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      upload: ${{ inputs.upload }}
      # public 저장소는 ARC 러너를 받지 못한다. 기본값(seorilabs-x64)이면 job이 큐에 남는다.
      runs_on: ubuntu-latest
      project_dir: godot
      wrapper_dir: ait/apps-in-toss-web
      web_output_dir: build/web
      # 중앙 기본값은 4.6.3이다. 조직 표준 버전을 명시한다.
      godot_version: "4.7.2"
      godot_status: stable
      smoke_command: |
        bash scripts/godot_quality_gate.sh \
          --project godot \
          --smoke-scene res://tests/core_test_runner.tscn \
          --smoke-scene res://tests/test_runner.tscn
