# Capacitor Android AAB + Google Play 업로드. Android release는 x64 Linux 재사용 워크플로우가 담당한다.
name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 stable SemVer 태그(vX.Y.Z)"
        type: string
        required: false
        default: ""
      upload:
        description: "true면 Google Play track에 업로드"
        type: boolean
        default: false
      track:
        type: choice
        options: [internal, production]
        default: internal
      release_status:
        type: choice
        options: [draft, completed]
        default: completed
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      track:
        type: string
        default: internal
      release_status:
        type: string
        default: completed
    # caller 는 secret 을 상속하지 않는다. 아래 이름만 1:1 로 명시 전달한다.
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write
  # org 재사용 워크플로우가 자체 선언한 권한이라 caller도 같이 부여해야 한다.
  packages: read

jobs:
  google-play:
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@main
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      package_manager: npm
      java_version: "21"
      android_dir: android
      prepare_script: scripts/prepare-native-release.mjs
