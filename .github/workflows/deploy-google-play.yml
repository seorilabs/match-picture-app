# Capacitor Android AAB + Google Play 업로드. Android release는 x64 Linux 재사용 워크플로우가 담당한다.
name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 stable SemVer 태그(vX.Y.Z)"
        type: string
        required: false
        default: ""
      upload:
        description: "true면 Google Play track에 업로드"
        type: boolean
        default: false
      track:
        type: choice
        options: [internal, production]
        default: internal
      release_status:
        type: choice
        options: [draft, completed]
        default: completed
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      track:
        type: string
        default: internal
      release_status:
        type: string
        default: completed

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  google-play:
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      package_manager: npm
      # @seorilabs/platform-sdk는 GitHub Packages(비공개)에서 받는다.
      # 이 두 입력은 seorilabs/.github PR #33 병합 후에 유효하다.
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: "@seorilabs"
      java_version: "21"
      android_dir: android
      prepare_script: scripts/prepare-native-release.mjs
      version_script: scripts/resolve-release-version.mjs
      upload_script: scripts/upload-google-play-internal.py
