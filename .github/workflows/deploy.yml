name: Deploy Apps in Toss

# main 병합 자동 배포 제거(쿼터 보호). 배포는 명시적 Release/Tag(v*.*.*) 또는 수동 dispatch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: deploy-apps-in-toss
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 20
    environment: apps-in-toss
    permissions:
      contents: write

    env:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      AIT_APP_DISPLAY_NAME: ${{ vars.AIT_APP_DISPLAY_NAME }}
      AIT_BRAND_ICON_URL: ${{ vars.AIT_BRAND_ICON_URL }}
      DEPLOY_MEMO: "GitHub Actions main deployment ${{ github.sha }}"
      VITE_AD_GROUP_ID: ${{ secrets.VITE_AD_GROUP_ID }}
      VITE_REMOTE_CONFIG_URL: ${{ vars.VITE_REMOTE_CONFIG_URL || 'https://config.vzyx.xyz/match-picture/launch-config.json' }}
      VITE_REMOTE_CONFIG_FALLBACK_URL: ${{ vars.VITE_REMOTE_CONFIG_FALLBACK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check required config
        run: |
          test -n "$APPS_IN_TOSS_API_KEY"
          test -n "$AIT_APP_DISPLAY_NAME"
          test -n "$AIT_BRAND_ICON_URL"
          test -n "$VITE_AD_GROUP_ID"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build AIT artifact
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: match-picture-app-deploy-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            match-picture-app.ait
            dist/**

      - name: Deploy to Apps in Toss
        run: npm run deploy -- --api-key "$APPS_IN_TOSS_API_KEY" --location ./match-picture-app.ait -m "$DEPLOY_MEMO"
