name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_REMOTE_CONFIG_URL: https://config.vzyx.xyz/match-picture/launch-config.json
      VITE_REMOTE_CONFIG_FALLBACK_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build AIT artifact
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-picture-app-ci-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            match-picture-app.ait
            dist/**
