name: CI

# PR→main 정적 게이트 추가(deploy.yml의 main 자동배포 제거 보완).
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Build
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 15

    env:
      AIT_APP_DISPLAY_NAME: ${{ vars.AIT_APP_DISPLAY_NAME }}
      AIT_BRAND_ICON_URL: ${{ vars.AIT_BRAND_ICON_URL }}
      VITE_REMOTE_CONFIG_URL: https://config.vzyx.xyz/match-picture/launch-config.json
      VITE_REMOTE_CONFIG_FALLBACK_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build AIT artifact
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: match-picture-app-ci-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            match-picture-app.ait
            dist/**
