# main 정적 품질 게이트 — org 재사용 워크플로우 호출.
# 무거운 빌드/배포 금지(태그/배포는 deploy-*.yml). 설계: seorilabs/.github docs/ci-cd.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # @seorilabs/platform-sdk는 GitHub Packages(비공개)에서 받는다.
  packages: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@main
    secrets: inherit
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      package_manager: npm
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: "@seorilabs"
      install_command: "npm ci"
      check_command: |
        npm run lint
        npm test
        npm run check:data-safety
