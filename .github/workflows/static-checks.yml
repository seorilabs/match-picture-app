# main 정적 품질 게이트 — org 재사용 워크플로우 호출.
# 무거운 빌드/배포 금지(태그/배포는 deploy-*.yml). 설계: seorilabs/.github docs/ci-cd.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # org 재사용 워크플로우가 자체 선언한 권한이라 caller도 같이 부여해야 한다.
  # 좁히면 workflow 시작 단계에서 startup_failure 가 된다.
  packages: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@main
    with:
      runs_on: ubuntu-latest
      package_manager: npm
      install_command: "npm ci"
      check_command: |
        npm run lint
        npm test
        npm run check:data-safety
        npm run test:release-version
