apiVersion: v1
kind: ConfigMap
metadata:
  name: match-picture-launch-config
  namespace: apps
  labels:
    app: match-picture-config-web
    app.kubernetes.io/name: match-picture-config
    app.kubernetes.io/part-of: match-picture
    app.kubernetes.io/component: launch-config
data:
  launch-config.json: |
    {
      "leaderboardEnabled": true,
      "reviewRequestEnabled": true,
      "interstitialAdEnabled": true
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: match-picture-config-nginx
  namespace: apps
  labels:
    app: match-picture-config-web
    app.kubernetes.io/name: match-picture-config
    app.kubernetes.io/part-of: match-picture
    app.kubernetes.io/component: nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Cache-Control "no-store, max-age=0" always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      location = /healthz {
        access_log off;
        return 204;
      }

      location = /match-picture/launch-config.json {
        default_type application/json;
        root /usr/share/nginx/html;
        try_files $uri =404;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-picture-config-web
  namespace: apps
  labels:
    app: match-picture-config-web
    app.kubernetes.io/name: match-picture-config
    app.kubernetes.io/part-of: match-picture
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-picture-config-web
  template:
    metadata:
      labels:
        app: match-picture-config-web
        app.kubernetes.io/name: match-picture-config
        app.kubernetes.io/part-of: match-picture
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /match-picture/launch-config.json
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: launch-config
              mountPath: /usr/share/nginx/html/match-picture
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: launch-config
          configMap:
            name: match-picture-launch-config
        - name: nginx-config
          configMap:
            name: match-picture-config-nginx
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: match-picture-config-service
  namespace: apps
  labels:
    app: match-picture-config-web
    app.kubernetes.io/name: match-picture-config
    app.kubernetes.io/part-of: match-picture
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: match-picture-config-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: match-picture-config-ingress
  namespace: apps
  labels:
    app: match-picture-config-web
    app.kubernetes.io/name: match-picture-config
    app.kubernetes.io/part-of: match-picture
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: public
  tls:
    - hosts:
        - config.vzyx.xyz
      secretName: config-vzyx-xyz-tls
  rules:
    - host: config.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: match-picture-config-service
                port:
                  number: 80
